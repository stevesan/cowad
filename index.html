<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw Together</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      font-family: system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }

    #toolbar h1 { font-size: 15px; font-weight: 700; color: #e94560; }

    button {
      padding: 5px 13px; border: none; border-radius: 5px;
      cursor: pointer; font-size: 13px; font-weight: 500;
    }
    #clearBtn { background: #e94560; color: white; }
    #clearBtn:hover { background: #c73652; }
    #eraserBtn { background: #2a2a4a; color: #aaa; border: 1px solid #0f3460; }
    #eraserBtn:hover { background: #3a3a5a; }
    #eraserBtn.active { background: #f5a623; color: #1a1a2e; border-color: #f5a623; }

    #meta { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 12px; }
    #users { color: #aaa; }
    #status {
      padding: 2px 9px; border-radius: 10px;
      font-size: 11px; font-weight: 500;
      background: #0f3460; color: #aaa;
    }
    #status.connected    { background: #0d5c2e; color: #6dffab; }
    #status.disconnected { background: #5c0d1a; color: #ffaab2; }

    canvas {
      flex: 1;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }
  </style>
</head>
<body>

<div id="toolbar">
  <h1>✏ Draw Together</h1>
  <button id="eraserBtn">Eraser</button>
  <button id="clearBtn">Clear All</button>
  <div id="meta">
    <span id="users">— online</span>
    <span id="status">Connecting…</span>
  </div>
</div>

<canvas id="canvas"></canvas>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
// ─── Firebase Config ──────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBTlTozCk6sPYJZmnWFGb_8ovB8IS_CEEc",
  authDomain: "rdb-test-2513b.firebaseapp.com",
  databaseURL: "https://rdb-test-2513b-default-rtdb.firebaseio.com",
  projectId: "rdb-test-2513b",
  storageBucket: "rdb-test-2513b.firebasestorage.app",
  messagingSenderId: "395624694880",
  appId: "1:395624694880:web:6c7750f08776cfd71daf05"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

function initCanvas() {
  canvas.width  = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
initCanvas();
window.addEventListener('resize', () => {
  initCanvas();
  allSegments.forEach(renderSegment);
});

// ─── State ────────────────────────────────────────────────────────────────────
const uid = Math.random().toString(36).slice(2, 10);
let erasing = false;
let drawing = false;
let lastX = 0, lastY = 0;
let lastClearedAt = Date.now();
const mySegments = new Set(); // skip re-drawing segments we already drew locally
const allSegments = [];       // full history so we can redraw on resize

// ─── Draw ─────────────────────────────────────────────────────────────────────
function renderSegment({ x0, y0, x1, y1, erase }) {
  ctx.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.strokeStyle = erase ? 'rgba(0,0,0,1)' : '#e94560';
  ctx.lineWidth   = erase ? 20 : 3;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}

function drawSegment(seg) {
  allSegments.push(seg);
  renderSegment(seg);
}

document.getElementById('eraserBtn').addEventListener('click', () => {
  erasing = !erasing;
  document.getElementById('eraserBtn').classList.toggle('active', erasing);
  canvas.style.cursor = erasing ? 'cell' : 'crosshair';
});

// ─── Input ────────────────────────────────────────────────────────────────────
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const src  = e.touches ? e.touches[0] : e;
  return { x: src.clientX - rect.left, y: src.clientY - rect.top };
}

canvas.addEventListener('mousedown', e => {
  drawing = true;
  ({ x: lastX, y: lastY } = getPos(e));
});

canvas.addEventListener('mousemove', e => {
  if (!drawing) return;
  const { x, y } = getPos(e);
  const seg = { x0: lastX, y0: lastY, x1: x, y1: y, erase: erasing, uid, t: Date.now() };

  drawSegment(seg); // draw locally with no lag

  const ref = db.ref('segments').push(seg); // sync to Firebase
  mySegments.add(ref.key);

  lastX = x; lastY = y;
});

canvas.addEventListener('mouseup',    () => drawing = false);
canvas.addEventListener('mouseleave', () => drawing = false);
canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing = true; ({ x: lastX, y: lastY } = getPos(e)); }, { passive: false });
canvas.addEventListener('touchmove',  e => { e.preventDefault(); if (drawing) canvas.dispatchEvent(Object.assign(new Event('mousemove'), { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY })); }, { passive: false });
canvas.addEventListener('touchend',   () => drawing = false);

// ─── Firebase: sync drawing ───────────────────────────────────────────────────
// child_added fires for all existing segments on load, then new ones in real time
db.ref('segments').on('child_added', snap => {
  if (mySegments.has(snap.key)) return; // already drawn locally
  drawSegment(snap.val());
});

// ─── Firebase: sync clear ─────────────────────────────────────────────────────
document.getElementById('clearBtn').addEventListener('click', () => {
  lastClearedAt = Date.now();
  allSegments.length = 0;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  db.ref('segments').remove();
  db.ref('meta/clearedAt').set(lastClearedAt);
});

db.ref('meta/clearedAt').on('value', snap => {
  const t = snap.val() || 0;
  if (t > lastClearedAt) {
    lastClearedAt = t;
    allSegments.length = 0;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
});

// ─── Firebase: presence ───────────────────────────────────────────────────────
const presenceRef = db.ref('presence/' + uid);
presenceRef.set(true);
presenceRef.onDisconnect().remove();

db.ref('presence').on('value', snap => {
  const n = snap.numChildren();
  document.getElementById('users').textContent = n + (n === 1 ? ' person' : ' people') + ' online';
});

// ─── Firebase: connection status ──────────────────────────────────────────────
const statusEl = document.getElementById('status');
db.ref('.info/connected').on('value', snap => {
  statusEl.textContent = snap.val() ? 'Connected' : 'Disconnected';
  statusEl.className   = snap.val() ? 'connected'  : 'disconnected';
});
</script>
</body>
</html>
