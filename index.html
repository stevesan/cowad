<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOOM Map Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #ccc; font-family: monospace; font-size: 12px;
           display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Toolbar ── */
    #toolbar { display: flex; align-items: center; gap: 6px; background: #1a1a1a;
               border-bottom: 1px solid #333; padding: 4px 8px; flex-shrink: 0; height: 36px; }
    #toolbar h1 { font-size: 13px; color: #c00; font-weight: bold; margin-right: 4px; letter-spacing: 1px; }
    .tool-btn { background: #2a2a2a; border: 1px solid #444; color: #999; padding: 3px 10px;
                cursor: pointer; border-radius: 3px; font-size: 12px; font-family: monospace; }
    .tool-btn.active { background: #900; color: #fff; border-color: #c00; }
    .tool-btn:hover:not(.active) { background: #3a3a3a; color: #fff; }
    .sep { width: 1px; background: #333; height: 20px; margin: 0 2px; }
    #clear-btn { background: #2a1a1a; border: 1px solid #633; color: #f88; padding: 3px 10px;
                 cursor: pointer; border-radius: 3px; font-size: 12px; }
    #clear-btn:hover { background: #4a2a2a; }
    #thing-type-sel { background: #2a2a2a; border: 1px solid #444; color: #aaa;
                      padding: 2px 4px; font-size: 11px; font-family: monospace; }
    #coords { color: #555; margin-left: auto; min-width: 80px; text-align: right; }
    #users  { color: #555; font-size: 11px; }
    #status { padding: 2px 8px; border-radius: 8px; font-size: 11px; background: #222; color: #666; }
    #status.connected    { background: #030; color: #0f0; }
    #status.disconnected { background: #300; color: #f66; }

    /* ── Main layout ── */
    #main { display: flex; flex: 1; overflow: hidden; }
    #canvas-wrap { flex: 1; position: relative; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }

    /* ── Properties panel ── */
    #panel { width: 260px; background: #141414; border-left: 1px solid #2a2a2a;
             overflow-y: auto; flex-shrink: 0; padding: 8px; }
    .panel-title { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px;
                   margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #222; }
    .prop-row { display: flex; align-items: center; margin-bottom: 5px; gap: 6px; }
    .prop-row label { color: #666; font-size: 11px; width: 72px; flex-shrink: 0; }
    .prop-row input[type=number],
    .prop-row input[type=text],
    .prop-row select { flex: 1; background: #1e1e1e; border: 1px solid #333; color: #ccc;
                       padding: 2px 5px; font-size: 11px; font-family: monospace; border-radius: 2px; }
    .prop-row input[type=checkbox] { accent-color: #c00; }
    .prop-section { border-top: 1px solid #222; padding-top: 6px; margin-top: 6px; }
    .prop-section .panel-title { color: #444; }
    #panel-empty { color: #333; font-size: 11px; text-align: center; padding: 24px 0; }
    .del-btn { width: 100%; background: #2a1414; border: 1px solid #633; color: #f66;
               padding: 4px; cursor: pointer; font-size: 11px; margin-top: 8px; border-radius: 2px; }
    .del-btn:hover { background: #4a2020; }

    /* ── Toast ── */
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
             background: #2a1a1a; color: #f88; border: 1px solid #633; padding: 7px 16px;
             border-radius: 4px; font-size: 12px; pointer-events: none; opacity: 0;
             transition: opacity 0.2s; z-index: 100; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <button class="tool-btn active" data-tool="select" title="Select / Move (S)">S</button>
  <button class="tool-btn" data-tool="vertex" title="Place Vertex (V)">V</button>
  <button class="tool-btn" data-tool="line"   title="Draw Line (L)">L</button>
  <button class="tool-btn" data-tool="sector" title="Create Sector (E)">E</button>
  <button class="tool-btn" data-tool="thing"  title="Place Thing (T)">T</button>
  <select id="thing-type-sel">

  <button id="clear-btn">Clear</button>

</div>

<div id="main">
  <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
  <div id="panel">
    <div id="panel-empty">Nothing selected.</div>
    <div id="panel-content" style="display:none"></div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
'use strict';

// ── Firebase ──────────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBTlTozCk6sPYJZmnWFGb_8ovB8IS_CEEc",
  authDomain: "rdb-test-2513b.firebaseapp.com",
  databaseURL: "https://rdb-test-2513b-default-rtdb.firebaseio.com",
  projectId: "rdb-test-2513b",
  storageBucket: "rdb-test-2513b.firebasestorage.app",
  messagingSenderId: "395624694880",
  appId: "1:395624694880:web:6c7750f08776cfd71daf05"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
function mapRef(col) { return db.ref('map/' + col); }

// ── Constants ─────────────────────────────────────────────────────────────────
const GRID = 32;
const SNAP = 8;
const THINGS = {
  1:    { name: 'Player 1 Start', cat: 'player', r: 16 },
  3004: { name: 'Zombieman',      cat: 'enemy',  r: 20 },
  9:    { name: 'Shotgun Guy',    cat: 'enemy',  r: 20 },
  3001: { name: 'Imp',           cat: 'enemy',  r: 20 },
  3002: { name: 'Demon',         cat: 'enemy',  r: 30 },
  3003: { name: 'Baron of Hell', cat: 'enemy',  r: 24 },
  16:   { name: 'Cyberdemon',    cat: 'enemy',  r: 40 },
  7:    { name: 'Spider Mastermind', cat: 'enemy', r: 128 },
  2001: { name: 'Shotgun',       cat: 'weapon', r: 10 },
  2002: { name: 'Chaingun',      cat: 'weapon', r: 10 },
  2006: { name: 'BFG 9000',      cat: 'weapon', r: 10 },
  2011: { name: 'Health Bonus',  cat: 'health', r: 10 },
  2012: { name: 'Medikit',       cat: 'health', r: 10 },
};
const CAT_COLOR = { player: '#0f0', enemy: '#f44', weapon: '#fa0', health: '#4af' };
const FLAG_BITS = [
  { bit: 1,  label: 'Impassable' },
  { bit: 4,  label: 'Two-Sided'  },
  { bit: 16, label: 'Upper Unpeg'},
  { bit: 32, label: 'Lower Unpeg'},
];

// ── App state ─────────────────────────────────────────────────────────────────
const uid = Math.random().toString(36).slice(2, 10);

const maps = {
  vertices: new Map(),
  linedefs: new Map(),
  sidedefs: new Map(),
  sectors:  new Map(),
  things:   new Map(),
};

let tool      = 'select';
let selected  = null;    // { type: 'vertex'|'linedef'|'sector'|'thing', id: string }
let lineStart = null;    // vertex id when drawing a linedef chain
let pan       = { x: 0, y: 0 };
let zoom      = 1;
let isPanning = false;
let panStart  = { mx: 0, my: 0, px: 0, py: 0 };
let spaceDown = false;
let dragState = null;    // { type, id } for dragging vertices/things
let mouseWorld = { x: 0, y: 0 };

// ── Canvas setup ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  draw();
}
window.addEventListener('resize', resize);

// ── Coordinate transforms ─────────────────────────────────────────────────────
function w2s(wx, wy) { return { x: wx * zoom + pan.x, y: -wy * zoom + pan.y }; }
function s2w(sx, sy) { return { x: (sx - pan.x) / zoom, y: -(sy - pan.y) / zoom }; }
function snap(v, g = SNAP) { return Math.round(v / g) * g; }

// ── Rendering ─────────────────────────────────────────────────────────────────
function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);
  drawGrid(W, H);
  drawSectors();
  drawLinedefs();
  drawVertices();
  drawThings();
  drawLinePreview();
}

function drawGrid(W, H) {
  const tl = s2w(0, 0), br = s2w(W, H);
  const x0 = Math.floor(tl.x / GRID) * GRID;
  const x1 = Math.ceil(br.x / GRID)  * GRID;
  const y0 = Math.floor(br.y / GRID) * GRID;
  const y1 = Math.ceil(tl.y / GRID)  * GRID;
  ctx.strokeStyle = '#181818';
  ctx.lineWidth = 1;
  for (let x = x0; x <= x1; x += GRID) {
    const sx = w2s(x, 0).x;
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
  }
  for (let y = y0; y <= y1; y += GRID) {
    const sy = w2s(0, y).y;
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
  }
  // Axes
  ctx.strokeStyle = '#252525';
  const o = w2s(0, 0);
  ctx.beginPath(); ctx.moveTo(o.x, 0); ctx.lineTo(o.x, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, o.y); ctx.lineTo(W, o.y); ctx.stroke();
}

function buildSectorPoly(sid) {
  // Collect directed edges where this sector is on the left (front or back)
  const edges = [];
  maps.linedefs.forEach(ld => {
    const fs = ld.frontSide ? maps.sidedefs.get(ld.frontSide) : null;
    const bs = ld.backSide  ? maps.sidedefs.get(ld.backSide)  : null;
    if (fs && fs.sector === sid) edges.push([ld.v1, ld.v2]);
    if (bs && bs.sector === sid) edges.push([ld.v2, ld.v1]);
  });
  if (!edges.length) return null;

  // Build directed adjacency
  const adj = new Map();
  for (const [a, b] of edges) {
    if (!adj.has(a)) adj.set(a, []);
    adj.get(a).push(b);
  }

  // Walk chain
  const start = edges[0][0];
  const chain = [start];
  const usedEdge = new Set([`${edges[0][0]}>${edges[0][1]}`]);
  let cur = edges[0][1];
  for (let i = 0; i < edges.length + 1; i++) {
    if (cur === start) break;
    chain.push(cur);
    const nexts = (adj.get(cur) || []).filter(n => !usedEdge.has(`${cur}>${n}`));
    if (!nexts.length) break;
    usedEdge.add(`${cur}>${nexts[0]}`);
    cur = nexts[0];
  }
  return chain.map(id => maps.vertices.get(id)).filter(Boolean);
}

function drawSectors() {
  maps.sectors.forEach((sec, sid) => {
    const poly = buildSectorPoly(sid);
    if (!poly || poly.length < 3) return;
    const isSel = selected && selected.type === 'sector' && selected.id === sid;
    const light = Math.max(0, Math.min(255, sec.light ?? 160));
    const c = Math.round(20 + (light / 255) * 70);
    ctx.fillStyle = `rgb(${c},${c},${Math.round(c * 0.75)})`;
    ctx.beginPath();
    const p0 = w2s(poly[0].x, poly[0].y);
    ctx.moveTo(p0.x, p0.y);
    for (let i = 1; i < poly.length; i++) {
      const p = w2s(poly[i].x, poly[i].y); ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.fill();
    if (isSel) { ctx.strokeStyle = '#ff0'; ctx.lineWidth = 2; ctx.stroke(); }
  });
}

function drawLinedefs() {
  maps.linedefs.forEach((ld, lid) => {
    const v1 = maps.vertices.get(ld.v1);
    const v2 = maps.vertices.get(ld.v2);
    if (!v1 || !v2) return;
    const s1 = w2s(v1.x, v1.y), s2 = w2s(v2.x, v2.y);
    const isSel   = selected && selected.type === 'linedef' && selected.id === lid;
    const twoSide = !!(ld.flags & 4);
    ctx.strokeStyle = isSel ? '#ff0' : twoSide ? '#aa0' : '#ddd';
    ctx.lineWidth   = isSel ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
    // Front-side tick
    const mx = (s1.x + s2.x) / 2, my = (s1.y + s2.y) / 2;
    const dx = s2.x - s1.x,        dy = s2.y - s1.y;
    const len = Math.hypot(dx, dy);
    if (len > 0) {
      const nx = -dy / len, ny = dx / len;
      ctx.strokeStyle = '#f00';
      ctx.lineWidth   = 1;
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.lineTo(mx + nx * 6, my + ny * 6);
      ctx.stroke();
    }
  });
}

function drawVertices() {
  maps.vertices.forEach((v, vid) => {
    const s     = w2s(v.x, v.y);
    const isSel = selected   && selected.type   === 'vertex' && selected.id   === vid;
    const isLS  = lineStart !== null && lineStart === vid;
    ctx.fillStyle = isLS ? '#f00' : isSel ? '#ff0' : '#0ff';
    ctx.fillRect(s.x - 3, s.y - 3, 6, 6);
  });
}

function drawThings() {
  maps.things.forEach((th, tid) => {
    const s    = w2s(th.x, th.y);
    const info = THINGS[th.type] || { r: 16, cat: 'player' };
    const r    = Math.max(info.r * zoom, 4);
    const isSel = selected && selected.type === 'thing' && selected.id === tid;
    ctx.strokeStyle = isSel ? '#ff0' : (CAT_COLOR[info.cat] || '#fff');
    ctx.lineWidth   = isSel ? 2 : 1;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2); ctx.stroke();
    const ang = ((th.angle ?? 0) * Math.PI) / 180;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + Math.cos(ang) * r, s.y - Math.sin(ang) * r);
    ctx.stroke();
  });
}

function drawLinePreview() {
  if (tool !== 'line' || lineStart === null) return;
  const v = maps.vertices.get(lineStart);
  if (!v) return;
  const s1 = w2s(v.x, v.y);
  const s2 = w2s(snap(mouseWorld.x), snap(mouseWorld.y));
  ctx.strokeStyle = '#ff0';
  ctx.lineWidth   = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
  ctx.setLineDash([]);
}

// ── Hit-testing ───────────────────────────────────────────────────────────────
function nearestVertex(wx, wy, thresh = 12 / zoom) {
  let best = null, bestD = thresh;
  maps.vertices.forEach((v, id) => {
    const d = Math.hypot(v.x - wx, v.y - wy);
    if (d < bestD) { bestD = d; best = id; }
  });
  return best;
}

function nearestLinedef(wx, wy, thresh = 8 / zoom) {
  let best = null, bestD = thresh;
  maps.linedefs.forEach((ld, id) => {
    const v1 = maps.vertices.get(ld.v1), v2 = maps.vertices.get(ld.v2);
    if (!v1 || !v2) return;
    const d = ptSegDist(wx, wy, v1.x, v1.y, v2.x, v2.y);
    if (d < bestD) { bestD = d; best = id; }
  });
  return best;
}

function nearestThing(wx, wy, thresh = 24 / zoom) {
  let best = null, bestD = thresh;
  maps.things.forEach((th, id) => {
    const d = Math.hypot(th.x - wx, th.y - wy);
    if (d < bestD) { bestD = d; best = id; }
  });
  return best;
}

function ptSegDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
  if (!len2) return Math.hypot(px - ax, py - ay);
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

function pointInPoly(px, py, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi))
      inside = !inside;
  }
  return inside;
}

function polyArea(poly) {
  let a = 0;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++)
    a += (poly[j].x + poly[i].x) * (poly[j].y - poly[i].y);
  return Math.abs(a) / 2;
}

// ── Sector detection (cycle finding) ─────────────────────────────────────────
function findEnclosingCycle(wx, wy) {
  // Build undirected adjacency from linedefs
  const adj = new Map();
  maps.linedefs.forEach(ld => {
    if (!adj.has(ld.v1)) adj.set(ld.v1, new Set());
    if (!adj.has(ld.v2)) adj.set(ld.v2, new Set());
    adj.get(ld.v1).add(ld.v2);
    adj.get(ld.v2).add(ld.v1);
  });
  if (!adj.size) return null;

  const MAX_DEPTH  = 18;
  const MAX_CYCLES = 300;
  const cycles     = [];
  const seenNorm   = new Set();

  function normalizeCycle(c) {
    const min = c.reduce((a, b) => (a < b ? a : b));
    const i   = c.indexOf(min);
    const rot = [...c.slice(i), ...c.slice(0, i)];
    const rev = [rot[0], ...rot.slice(1).reverse()];
    const s1  = rot.join('|'), s2 = rev.join('|');
    return s1 < s2 ? s1 : s2;
  }

  for (const start of adj.keys()) {
    if (cycles.length >= MAX_CYCLES) break;
    const path    = [start];
    const visited = new Set([start]);

    (function dfs() {
      if (cycles.length >= MAX_CYCLES || path.length > MAX_DEPTH) return;
      const cur = path[path.length - 1];
      for (const n of adj.get(cur)) {
        if (path.length >= 3 && n === start) {
          const norm = normalizeCycle(path);
          if (!seenNorm.has(norm)) { seenNorm.add(norm); cycles.push([...path]); }
          continue;
        }
        if (visited.has(n)) continue;
        visited.add(n); path.push(n);
        dfs();
        path.pop(); visited.delete(n);
      }
    })();
  }

  // Find smallest enclosing polygon
  let bestCycle = null, bestArea = Infinity;
  for (const cycle of cycles) {
    const poly = cycle.map(id => maps.vertices.get(id)).filter(Boolean);
    if (poly.length < 3 || !pointInPoly(wx, wy, poly)) continue;
    const a = polyArea(poly);
    if (a < bestArea) { bestArea = a; bestCycle = cycle; }
  }
  return bestCycle;
}

// ── Firebase sync ─────────────────────────────────────────────────────────────
function syncCollection(col) {
  const ref = mapRef(col);
  ref.on('child_added',   s => { maps[col].set(s.key, s.val()); draw(); });
  ref.on('child_changed', s => {
    maps[col].set(s.key, s.val());
    draw();
    // Refresh panel if this entity is selected
    if (selected && selected.type === colToType(col) && selected.id === s.key) renderPanel();
  });
  ref.on('child_removed', s => {
    maps[col].delete(s.key);
    if (selected && selected.type === colToType(col) && selected.id === s.key) {
      selected = null; renderPanel();
    }
    draw();
  });
}

function colToType(col) { return col.replace(/s$/, ''); }

['vertices','linedefs','sidedefs','sectors','things'].forEach(syncCollection);

// ── Map actions ───────────────────────────────────────────────────────────────
function placeVertex(wx, wy) {
  return mapRef('vertices').push({ x: snap(wx), y: snap(wy) }).then(r => r.key);
}

function placeLine(v1id, v2id) {
  return mapRef('linedefs').push({ v1: v1id, v2: v2id, flags: 1, frontSide: null, backSide: null });
}

function placeThing(wx, wy) {
  const type = parseInt(document.getElementById('thing-type-sel').value, 10);
  mapRef('things').push({ x: snap(wx), y: snap(wy), angle: 0, type, flags: 7 });
}

function deleteSelected() {
  if (!selected) return;
  const { type, id } = selected;
  if (type === 'vertex') {
    const lines = [];
    maps.linedefs.forEach((ld, lid) => { if (ld.v1 === id || ld.v2 === id) lines.push(lid); });
    lines.forEach(deleteLinedef);
    mapRef('vertices').child(id).remove();
  } else if (type === 'linedef') {
    deleteLinedef(id);
  } else if (type === 'sector') {
    maps.sidedefs.forEach((sd, sdid) => {
      if (sd.sector === id) mapRef('sidedefs').child(sdid).update({ sector: null });
    });
    mapRef('sectors').child(id).remove();
  } else if (type === 'thing') {
    mapRef('things').child(id).remove();
  }
  selected = null;
  renderPanel();
}

function deleteLinedef(lid) {
  const ld = maps.linedefs.get(lid);
  if (!ld) return;
  if (ld.frontSide) mapRef('sidedefs').child(ld.frontSide).remove();
  if (ld.backSide)  mapRef('sidedefs').child(ld.backSide).remove();
  mapRef('linedefs').child(lid).remove();
}

async function applySectorTool(wx, wy) {
  const cycle = findEnclosingCycle(wx, wy);
  if (!cycle) { showToast('No closed region found.'); return; }

  const secRef = await mapRef('sectors').push({ floor: 0, ceiling: 128, light: 160, special: 0, tag: 0, floorTex: 'FLOOR4_8', ceilTex: 'CEIL3_5' });
  const sid = secRef.key;

  for (let i = 0; i < cycle.length; i++) {
    const va = cycle[i], vb = cycle[(i + 1) % cycle.length];
    let matchId = null, matchLd = null, reversed = false;
    maps.linedefs.forEach((ld, lid) => {
      if (ld.v1 === va && ld.v2 === vb) { matchId = lid; matchLd = ld; reversed = false; }
      else if (ld.v1 === vb && ld.v2 === va) { matchId = lid; matchLd = ld; reversed = true; }
    });
    if (!matchId || !matchLd) continue;

    const sdRef = await mapRef('sidedefs').push({ sector: sid, xoff: 0, yoff: 0, upper: '-', mid: 'STARTAN2', lower: '-' });
    if (!reversed) {
      await mapRef('linedefs').child(matchId).update({ frontSide: sdRef.key });
    } else {
      const newFlags = (matchLd.flags | 4) & ~1; // two-sided, not impassable
      await mapRef('linedefs').child(matchId).update({ backSide: sdRef.key, flags: newFlags });
    }
  }

  selected = { type: 'sector', id: sid };
  renderPanel();
}

// ── Properties panel ──────────────────────────────────────────────────────────
function renderPanel() {
  const pEmpty   = document.getElementById('panel-empty');
  const pContent = document.getElementById('panel-content');

  if (!selected) {
    pEmpty.style.display = ''; pContent.style.display = 'none'; pContent.innerHTML = ''; return;
  }
  pEmpty.style.display = 'none'; pContent.style.display = '';

  const { type, id } = selected;
  const col    = type + 's';
  const entity = maps[col] && maps[col].get(id);
  if (!entity) { pContent.innerHTML = '<div id="panel-empty">Not found.</div>'; return; }

  let html = `<div class="panel-title">${type} <span style="color:#444">${id.slice(-6)}</span></div>`;

  function numField(label, path, val, step = 1) {
    return `<div class="prop-row"><label>${label}</label>
      <input type="number" data-path="${path}" value="${val ?? 0}" step="${step}"></div>`;
  }
  function txtField(label, path, val) {
    return `<div class="prop-row"><label>${label}</label>
      <input type="text" data-path="${path}" value="${esc(val ?? '')}"></div>`;
  }
  function chkField(label, bitmaskPath, bit, flags) {
    const checked = (flags & bit) ? 'checked' : '';
    return `<div class="prop-row"><label>${label}</label>
      <input type="checkbox" data-bitmask="${bitmaskPath}" data-bit="${bit}" ${checked}></div>`;
  }
  function sidedefBlock(title, sdid) {
    const sd = maps.sidedefs.get(sdid);
    if (!sd) return '';
    const p = id => `sidedefs/${sdid}/${id}`;
    return `<div class="prop-section">
      <div class="panel-title">${title}</div>
      ${txtField('Sector', p('sector'), sd.sector)}
      ${numField('X Off',  p('xoff'),  sd.xoff)}
      ${numField('Y Off',  p('yoff'),  sd.yoff)}
      ${txtField('Upper',  p('upper'), sd.upper)}
      ${txtField('Mid',    p('mid'),   sd.mid)}
      ${txtField('Lower',  p('lower'), sd.lower)}
    </div>`;
  }

  if (type === 'vertex') {
    const p = f => `vertices/${id}/${f}`;
    html += numField('X', p('x'), entity.x) + numField('Y', p('y'), entity.y);

  } else if (type === 'linedef') {
    const p = f => `linedefs/${id}/${f}`;
    html += numField('Special', p('special'), entity.special)
          + numField('Tag',     p('tag'),     entity.tag);
    html += `<div class="prop-section"><div class="panel-title">Flags</div>`;
    for (const { bit, label } of FLAG_BITS)
      html += chkField(label, `linedefs/${id}/flags`, bit, entity.flags || 0);
    html += `</div>`;
    if (entity.frontSide) html += sidedefBlock('Front Sidedef', entity.frontSide);
    if (entity.backSide)  html += sidedefBlock('Back Sidedef',  entity.backSide);

  } else if (type === 'sector') {
    const p = f => `sectors/${id}/${f}`;
    html += numField('Floor H',   p('floor'),    entity.floor)
          + numField('Ceil H',    p('ceiling'),  entity.ceiling)
          + txtField('Floor Tex', p('floorTex'), entity.floorTex || 'FLOOR4_8')
          + txtField('Ceil Tex',  p('ceilTex'),  entity.ceilTex  || 'CEIL3_5')
          + numField('Light',     p('light'),    entity.light)
          + numField('Special',   p('special'),  entity.special)
          + numField('Tag',       p('tag'),      entity.tag);

  } else if (type === 'thing') {
    const p = f => `things/${id}/${f}`;
    html += numField('X',     p('x'),     entity.x)
          + numField('Y',     p('y'),     entity.y)
          + numField('Angle', p('angle'), entity.angle);
    html += `<div class="prop-row"><label>Type</label><select data-path="${p('type')}">`;
    for (const [t, info] of Object.entries(THINGS))
      html += `<option value="${t}" ${entity.type == t ? 'selected' : ''}>${info.name}</option>`;
    html += `</select></div>`;
    html += numField('Flags', p('flags'), entity.flags);
  }

  html += `<button class="del-btn" id="del-btn">Delete ${type}</button>`;
  pContent.innerHTML = html;

  // Bind inputs: data-path="col/id/field"
  pContent.querySelectorAll('[data-path]').forEach(el => {
    el.addEventListener('change', () => {
      const [c, i, f] = el.dataset.path.split('/');
      const val = (el.type === 'number') ? (parseFloat(el.value) || 0)
                : (el.tagName === 'SELECT') ? (isNaN(el.value) ? el.value : +el.value)
                : el.value;
      mapRef(c).child(i).update({ [f]: val });
    });
  });

  // Bind bitmask checkboxes: data-bitmask="col/id/field" data-bit="N"
  pContent.querySelectorAll('[data-bitmask]').forEach(el => {
    el.addEventListener('change', () => {
      const [c, i, f] = el.dataset.bitmask.split('/');
      const bit = parseInt(el.dataset.bit, 10);
      const cur = (maps[c].get(i) || {})[f] || 0;
      const val = el.checked ? (cur | bit) : (cur & ~bit);
      mapRef(c).child(i).update({ [f]: val });
    });
  });

  document.getElementById('del-btn').addEventListener('click', deleteSelected);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Canvas input ──────────────────────────────────────────────────────────────
function getCanvasXY(e) {
  const r = canvas.getBoundingClientRect();
  return { sx: e.clientX - r.left, sy: e.clientY - r.top };
}

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('mousemove', e => {
  const { sx, sy } = getCanvasXY(e);
  mouseWorld = s2w(sx, sy);
  document.getElementById('coords').textContent =
    `${Math.round(mouseWorld.x)}, ${Math.round(mouseWorld.y)}`;

  if (isPanning) {
    pan.x = panStart.px + (e.clientX - panStart.mx);
    pan.y = panStart.py + (e.clientY - panStart.my);
    draw(); return;
  }

  if (dragState) {
    const wx = snap(mouseWorld.x), wy = snap(mouseWorld.y);
    if (dragState.type === 'vertex') mapRef('vertices').child(dragState.id).update({ x: wx, y: wy });
    else if (dragState.type === 'thing') mapRef('things').child(dragState.id).update({ x: wx, y: wy });
    return;
  }

  if (tool === 'line') draw();
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 1 || (e.button === 0 && spaceDown)) {
    isPanning = true;
    panStart = { mx: e.clientX, my: e.clientY, px: pan.x, py: pan.y };
    e.preventDefault(); return;
  }
  if (e.button !== 0) return;

  const { sx, sy } = getCanvasXY(e);
  const { x: wx, y: wy } = s2w(sx, sy);

  if (tool === 'select') {
    const vid = nearestVertex(wx, wy);
    const tid = nearestThing(wx, wy);
    const lid = nearestLinedef(wx, wy);

    if (vid !== null) {
      select('vertex', vid);
      dragState = { type: 'vertex', id: vid };
    } else if (tid !== null) {
      select('thing', tid);
      dragState = { type: 'thing', id: tid };
    } else if (lid !== null) {
      select('linedef', lid);
    } else {
      // Check sectors by polygon containment
      let found = null;
      maps.sectors.forEach((_, sid) => {
        const poly = buildSectorPoly(sid);
        if (poly && pointInPoly(wx, wy, poly)) found = sid;
      });
      if (found) select('sector', found);
      else { selected = null; renderPanel(); }
    }
    draw();

  } else if (tool === 'vertex') {
    placeVertex(wx, wy);

  } else if (tool === 'line') {
    const vid = nearestVertex(wx, wy);
    if (vid !== null) {
      if (lineStart === null) {
        lineStart = vid;
      } else {
        if (vid !== lineStart) placeLine(lineStart, vid);
        lineStart = vid;
      }
      draw();
    } else {
      placeVertex(wx, wy).then(newId => {
        if (lineStart !== null) placeLine(lineStart, newId);
        lineStart = newId;
        draw();
      });
    }

  } else if (tool === 'sector') {
    applySectorTool(wx, wy);

  } else if (tool === 'thing') {
    placeThing(wx, wy);
  }
});

canvas.addEventListener('mouseup', () => { isPanning = false; dragState = null; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const { sx, sy } = getCanvasXY(e);
  const before = s2w(sx, sy);
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  zoom = Math.max(0.05, Math.min(32, zoom * factor));
  const after = s2w(sx, sy);
  pan.x += (after.x - before.x) * zoom;
  pan.y -= (after.y - before.y) * zoom;
  draw();
}, { passive: false });

// ── Keyboard ──────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === ' ')      { spaceDown = true; e.preventDefault(); return; }
  if (e.key === 'Escape') { lineStart = null; draw(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { deleteSelected(); return; }
  const map = { s: 'select', v: 'vertex', l: 'line', e: 'sector', t: 'thing' };
  if (map[e.key.toLowerCase()]) setTool(map[e.key.toLowerCase()]);
});
window.addEventListener('keyup', e => { if (e.key === ' ') spaceDown = false; });

// ── Tool switching ────────────────────────────────────────────────────────────
function setTool(t) {
  tool = t; lineStart = null;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  // Update cursor
  canvas.style.cursor = (t === 'select') ? 'default' : 'crosshair';
  draw();
}

document.querySelectorAll('.tool-btn').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));

// ── Selection helper ──────────────────────────────────────────────────────────
function select(type, id) { selected = { type, id }; renderPanel(); }

// ── Clear ─────────────────────────────────────────────────────────────────────
document.getElementById('clear-btn').addEventListener('click', () => {
  if (!confirm('Clear the entire map? This cannot be undone.')) return;
  db.ref('map').remove();
  selected = null; renderPanel();
});

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Presence & connection status ──────────────────────────────────────────────
const presRef = db.ref('presence/' + uid);
presRef.set(true);
presRef.onDisconnect().remove();

db.ref('presence').on('value', snap => {
  const n = snap.numChildren();
  document.getElementById('users').textContent = n + (n === 1 ? ' user' : ' users');
});

db.ref('.info/connected').on('value', snap => {
  const el = document.getElementById('status');
  el.textContent = snap.val() ? 'Connected' : 'Offline';
  el.className   = snap.val() ? 'connected'  : 'disconnected';
});

// ── WAD Export ────────────────────────────────────────────────────────────────
function exportWAD() {
  function str8(s) {
    const buf = new Uint8Array(8);
    s = (s == null || s === '') ? '-' : String(s);
    for (let i = 0; i < Math.min(s.length, 8); i++) buf[i] = s.charCodeAt(i);
    return buf;
  }

  // ── Index maps: Firebase push-ID → sequential integer ──
  const vertIdx = new Map(), secIdx = new Map(), sdIdx = new Map();
  let vi = 0; maps.vertices.forEach((_, id) => vertIdx.set(id, vi++));
  let si = 0; maps.sectors.forEach((_, id) => secIdx.set(id, si++));
  let di = 0; maps.sidedefs.forEach((_, id) => sdIdx.set(id, di++));

  // ── Filter linedefs: skip any where vertices are missing OR the same ──
  // (zero-length / dangling linedefs crash BSP builders)
  const validLinedefs = []; // [{ lid, ld, v1i, v2i }]
  maps.linedefs.forEach((ld, lid) => {
    const v1i = vertIdx.get(ld.v1), v2i = vertIdx.get(ld.v2);
    if (v1i == null || v2i == null || v1i === v2i) return;
    validLinedefs.push({ lid, ld, v1i, v2i });
  });

  // Rebuild linedef index from only the valid ones
  const ldIdx = new Map();
  validLinedefs.forEach(({ lid }, i) => ldIdx.set(lid, i));

  const nV = maps.vertices.size, nS = maps.sectors.size, nD = maps.sidedefs.size,
        nL = validLinedefs.length, nT = maps.things.size;
  const skipped = maps.linedefs.size - nL;

  // ── Pre-export validation (logged to console for debugging) ──
  const issues = [];
  if (!maps.things.size) issues.push('No things placed');
  else if (![...maps.things.values()].some(t => t.type === 1))
    issues.push('No Player 1 Start (thing type 1) — game will crash on load');
  if (skipped) issues.push(`${skipped} degenerate linedef(s) skipped (missing/identical vertices)`);
  const missingFront = validLinedefs.filter(({ ld }) => !ld.frontSide).length;
  if (missingFront) issues.push(`${missingFront} linedef(s) have no front sidedef`);
  if (!nS && nD) issues.push('Sidedefs exist but no sectors — sidedef sector refs will be invalid');

  console.group('[WAD Export]');
  console.log(`Vertices:${nV}  Linedefs:${nL}  Sidedefs:${nD}  Sectors:${nS}  Things:${nT}`);
  if (issues.length) { console.warn('Issues found:'); issues.forEach(s => console.warn(' •', s)); }
  console.groupEnd();

  if (issues.some(s => s.includes('No Player 1 Start'))) showToast('⚠ No Player 1 Start — add thing type 1');

  // ── THINGS (10 bytes each) ──
  const thingsBuf = new ArrayBuffer(nT * 10);
  const thV = new DataView(thingsBuf); let to = 0;
  maps.things.forEach(th => {
    thV.setInt16(to, Math.round(th.x     ?? 0), true); to += 2;
    thV.setInt16(to, Math.round(th.y     ?? 0), true); to += 2;
    thV.setInt16(to, Math.round(th.angle ?? 0), true); to += 2;
    thV.setInt16(to, th.type  ?? 1,             true); to += 2;
    thV.setInt16(to, th.flags ?? 7,             true); to += 2;
  });

  // ── LINEDEFS (14 bytes each, valid only) ──
  const linesBuf = new ArrayBuffer(nL * 14);
  const lV = new DataView(linesBuf); let lo = 0;
  for (const { ld, v1i, v2i } of validLinedefs) {
    lV.setInt16(lo, v1i,                                                        true); lo += 2;
    lV.setInt16(lo, v2i,                                                        true); lo += 2;
    lV.setInt16(lo, ld.flags   ?? 1,                                            true); lo += 2;
    lV.setInt16(lo, ld.special ?? 0,                                            true); lo += 2;
    lV.setInt16(lo, ld.tag     ?? 0,                                            true); lo += 2;
    lV.setInt16(lo, ld.frontSide ? (sdIdx.get(ld.frontSide) ?? -1) : -1,       true); lo += 2;
    lV.setInt16(lo, ld.backSide  ? (sdIdx.get(ld.backSide)  ?? -1) : -1,       true); lo += 2;
  }

  // ── SIDEDEFS (30 bytes each) ──
  const sidesBuf = new ArrayBuffer(nD * 30);
  const sV = new DataView(sidesBuf), sU = new Uint8Array(sidesBuf); let so = 0;
  maps.sidedefs.forEach(sd => {
    sV.setInt16(so, sd.xoff ?? 0, true); so += 2;
    sV.setInt16(so, sd.yoff ?? 0, true); so += 2;
    sU.set(str8(sd.upper), so); so += 8;
    sU.set(str8(sd.lower), so); so += 8;
    sU.set(str8(sd.mid),   so); so += 8;
    // Use 0 if sector missing; invalid but non-crashing for a valid sector count
    sV.setInt16(so, secIdx.get(sd.sector) ?? 0, true); so += 2;
  });

  // ── VERTEXES (4 bytes each) ──
  const vertsBuf = new ArrayBuffer(nV * 4);
  const vV = new DataView(vertsBuf); let vo = 0;
  maps.vertices.forEach(v => {
    vV.setInt16(vo, Math.round(v.x ?? 0), true); vo += 2;
    vV.setInt16(vo, Math.round(v.y ?? 0), true); vo += 2;
  });

  // ── SEGS (12 bytes each) — one per valid linedef front (+ back if two-sided) ──
  // GZDoom rebuilds BSP from scratch when NODES is empty, but older ports need
  // at least a non-empty SSECTORS lump to avoid BSP traversal crash.
  const segList = [];
  for (const { lid, ld, v1i, v2i } of validLinedefs) {
    if (!ld.frontSide) continue;
    const v1 = maps.vertices.get(ld.v1), v2 = maps.vertices.get(ld.v2);
    const dx = v2.x - v1.x, dy = v2.y - v1.y;
    const ang = Math.round(Math.atan2(dy, dx) / (2 * Math.PI) * 65536) & 0xFFFF;
    segList.push({ v1: v1i, v2: v2i, angle: ang,                 linedef: ldIdx.get(lid), side: 0, offset: 0 });
    if (ld.backSide)
      segList.push({ v1: v2i, v2: v1i, angle: (ang + 32768) & 0xFFFF, linedef: ldIdx.get(lid), side: 1, offset: 0 });
  }
  const segsBuf = new ArrayBuffer(segList.length * 12);
  const sgV = new DataView(segsBuf); let sgo = 0;
  for (const seg of segList) {
    sgV.setInt16(sgo, seg.v1,       true); sgo += 2;
    sgV.setInt16(sgo, seg.v2,       true); sgo += 2;
    sgV.setUint16(sgo, seg.angle,   true); sgo += 2;
    sgV.setInt16(sgo, seg.linedef,  true); sgo += 2;
    sgV.setInt16(sgo, seg.side,     true); sgo += 2;
    sgV.setInt16(sgo, seg.offset,   true); sgo += 2;
  }

  // ── SSECTORS (4 bytes each) — one subsector containing all segs ──
  // With NODES empty, Doom ports use subsector 0 as the root, so this is valid.
  // GZDoom ignores these entirely and rebuilds from linedefs.
  const ssectorsBuf = segList.length ? new ArrayBuffer(4) : new ArrayBuffer(0);
  if (segList.length) {
    const ssV = new DataView(ssectorsBuf);
    ssV.setInt16(0, segList.length, true); // numSegs
    ssV.setInt16(2, 0,              true); // firstSeg
  }

  // ── SECTORS (26 bytes each) ──
  const sectsBuf = new ArrayBuffer(nS * 26);
  const seV = new DataView(sectsBuf), seU = new Uint8Array(sectsBuf); let seo = 0;
  maps.sectors.forEach(sec => {
    seV.setInt16(seo, sec.floor   ?? 0,   true); seo += 2;
    seV.setInt16(seo, sec.ceiling ?? 128, true); seo += 2;
    seU.set(str8(sec.floorTex || 'FLOOR4_8'), seo); seo += 8;
    seU.set(str8(sec.ceilTex  || 'CEIL3_5'),  seo); seo += 8;
    seV.setInt16(seo, sec.light   ?? 160, true); seo += 2;
    seV.setInt16(seo, sec.special ?? 0,   true); seo += 2;
    seV.setInt16(seo, sec.tag     ?? 0,   true); seo += 2;
  });

  // ── REJECT (all zeros) ──
  const rejectBuf = new ArrayBuffer(nS > 0 ? Math.ceil((nS * nS) / 8) : 0);

  // ── BLOCKMAP ──
  function buildBlockmap() {
    if (!nV || !nL) return new ArrayBuffer(0); // let port build it
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    maps.vertices.forEach(v => {
      minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x);
      minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
    });
    const ox = Math.floor(minX) - 8, oy = Math.floor(minY) - 8;
    const cols = Math.max(1, Math.ceil((maxX - ox) / 128) + 1);
    const rows = Math.max(1, Math.ceil((maxY - oy) / 128) + 1);

    // Linedef AABBs (using only valid linedefs, with their new sequential indices)
    const lineArr = validLinedefs.map(({ ld }, i) => {
      const v1 = maps.vertices.get(ld.v1), v2 = maps.vertices.get(ld.v2);
      return { i, x0: Math.min(v1.x,v2.x), x1: Math.max(v1.x,v2.x),
                  y0: Math.min(v1.y,v2.y), y1: Math.max(v1.y,v2.y) };
    });

    const blockLists = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const bx0 = ox + c*128, bx1 = bx0 + 128;
        const by0 = oy + r*128, by1 = by0 + 128;
        const list = [0]; // start marker
        for (const l of lineArr)
          if (l.x1 >= bx0 && l.x0 <= bx1 && l.y1 >= by0 && l.y0 <= by1) list.push(l.i);
        list.push(0xFFFF);
        blockLists.push(list);
      }
    }
    const headerWords = 4 + cols * rows;
    const offsets = []; let curOff = headerWords;
    for (const bl of blockLists) { offsets.push(curOff); curOff += bl.length; }

    const buf = new ArrayBuffer(curOff * 2);
    const dv = new DataView(buf); let p = 0;
    dv.setInt16(p, ox,   true); p += 2;
    dv.setInt16(p, oy,   true); p += 2;
    dv.setInt16(p, cols, true); p += 2;
    dv.setInt16(p, rows, true); p += 2;
    for (const off of offsets)           { dv.setUint16(p, off, true); p += 2; }
    for (const bl of blockLists) for (const v of bl) { dv.setUint16(p, v,   true); p += 2; }
    return buf;
  }

  // ── Assemble PWAD ──
  const lumps = [
    { name: 'MAP01',    buf: new ArrayBuffer(0) },
    { name: 'THINGS',   buf: thingsBuf  },
    { name: 'LINEDEFS', buf: linesBuf   },
    { name: 'SIDEDEFS', buf: sidesBuf   },
    { name: 'VERTEXES', buf: vertsBuf   },
    { name: 'SEGS',     buf: segsBuf    },
    { name: 'SSECTORS', buf: ssectorsBuf},
    { name: 'NODES',    buf: new ArrayBuffer(0) }, // empty → port rebuilds BSP
    { name: 'SECTORS',  buf: sectsBuf   },
    { name: 'REJECT',   buf: rejectBuf  },
    { name: 'BLOCKMAP', buf: buildBlockmap() },
  ];

  const dataSize  = lumps.reduce((a, l) => a + l.buf.byteLength, 0);
  const dirOffset = 12 + dataSize;
  const wad = new ArrayBuffer(dirOffset + lumps.length * 16);
  const wdv = new DataView(wad), wu8 = new Uint8Array(wad);

  wu8.set([80,87,65,68], 0); // "PWAD"
  wdv.setInt32(4, lumps.length, true);
  wdv.setInt32(8, dirOffset,    true);

  let off = 12;
  const entries = [];
  for (const l of lumps) {
    entries.push({ off, size: l.buf.byteLength, name: l.name });
    if (l.buf.byteLength > 0) { wu8.set(new Uint8Array(l.buf), off); off += l.buf.byteLength; }
  }

  let dp = dirOffset;
  for (const e of entries) {
    wdv.setInt32(dp, e.off,  true); dp += 4;
    wdv.setInt32(dp, e.size, true); dp += 4;
    wu8.set(str8(e.name), dp); dp += 8;
  }

  // Log directory for debugging
  console.table(entries.map(e => ({ lump: e.name, offset: e.off, size: e.size })));

  const blob = new Blob([wad], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'map.wad';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast(`MAP01 exported — ${nV}v ${nL}l ${nD}sd ${nS}s ${nT}t` + (skipped ? ` (${skipped} bad ld skipped)` : ''));
}

document.getElementById('wad-btn').addEventListener('click', exportWAD);

// ── Init ──────────────────────────────────────────────────────────────────────
resize();
pan.x = canvas.width  / 2;
pan.y = canvas.height / 2;
draw();
</script>
