<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Together</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    #app {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Header */
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 { font-size: 22px; font-weight: 700; color: #e94560; }
    #meta { display: flex; align-items: center; gap: 10px; font-size: 12px; }
    #users { color: #888; }
    #status {
      padding: 2px 9px; border-radius: 10px;
      font-size: 11px; font-weight: 500;
      background: #0f3460; color: #aaa;
    }
    #status.connected    { background: #0d5c2e; color: #6dffab; }
    #status.disconnected { background: #5c0d1a; color: #ffaab2; }

    /* Add form */
    #add-form {
      display: flex;
      gap: 8px;
    }
    #add-form input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #0f3460;
      background: #16213e;
      color: #eee;
      font-size: 14px;
      outline: none;
    }
    #add-form input:focus { border-color: #e94560; }
    #add-form input::placeholder { color: #555; }
    #add-form button {
      padding: 10px 18px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #add-form button:hover { background: #c73652; }

    /* List */
    #todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
    }

    .todo-item input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: #e94560;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      font-size: 14px;
      line-height: 1.4;
      cursor: text;
    }
    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: #555;
    }

    .todo-edit {
      flex: 1;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #e94560;
      background: #0f3460;
      color: #eee;
      outline: none;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #555;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
    }
    .delete-btn:hover { color: #e94560; }

    #empty {
      text-align: center;
      color: #555;
      font-size: 14px;
      padding: 32px 0;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #5c0d1a;
      color: #ffaab2;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
<div id="app">

  <header>
    <h1>Todo Together</h1>
    <div id="meta">
      <span id="users">— online</span>
      <span id="status">Connecting…</span>
    </div>
  </header>

  <form id="add-form">
    <input type="text" id="add-input" placeholder="Add a todo…" autocomplete="off">
    <button type="submit">Add</button>
  </form>

  <div id="todo-list">
    <div id="empty">No todos yet.</div>
  </div>

</div>
<div id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
// ─── Firebase Config ──────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBTlTozCk6sPYJZmnWFGb_8ovB8IS_CEEc",
  authDomain: "rdb-test-2513b.firebaseapp.com",
  databaseURL: "https://rdb-test-2513b-default-rtdb.firebaseio.com",
  projectId: "rdb-test-2513b",
  storageBucket: "rdb-test-2513b.firebasestorage.app",
  messagingSenderId: "395624694880",
  appId: "1:395624694880:web:6c7750f08776cfd71daf05"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ─── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function showError(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
}

// ─── DOM helpers ──────────────────────────────────────────────────────────────
const list    = document.getElementById('todo-list');
const empty   = document.getElementById('empty');
const todoEls = {}; // key → li element

function updateEmpty() {
  empty.style.display = Object.keys(todoEls).length === 0 ? 'block' : 'none';
}

function createTodoEl(key, { text, done }) {
  const li = document.createElement('li');
  li.className = 'todo-item' + (done ? ' done' : '');
  li.innerHTML = `
    <input type="checkbox" ${done ? 'checked' : ''}>
    <span class="todo-text">${escapeHtml(text)}</span>
    <button class="delete-btn" title="Delete">×</button>
  `;

  // Keep a stable reference to the span so child_changed can update it
  // even while it is temporarily detached from the DOM during editing.
  li._textSpan = li.querySelector('.todo-text');

  li.querySelector('input').addEventListener('change', e => {
    const checked = e.target.checked;
    db.ref('todos/' + key + '/done').set(checked).catch(() => {
      e.target.checked = !checked;
      showError('Failed to update — try again.');
    });
  });

  li.querySelector('.delete-btn').addEventListener('click', () => {
    db.ref('todos/' + key).remove().catch(() => {
      showError('Failed to delete — try again.');
    });
  });

  li.querySelector('.todo-text').addEventListener('dblclick', () => {
    const span  = li.querySelector('.todo-text');
    const input = document.createElement('input');
    input.className = 'todo-edit';
    input.value = span.textContent;
    span.replaceWith(input);
    input.focus();
    input.select();

    let committed = false;
    function commit() {
      if (committed) return;
      committed = true;
      const newText = input.value.trim();
      input.replaceWith(span);
      if (!newText || newText === span.textContent) return;
      const original = span.textContent;
      db.ref('todos/' + key + '/text').set(newText).catch(() => {
        span.textContent = original;
        showError('Failed to save — change reverted.');
      });
    }

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter')  { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { committed = true; input.replaceWith(span); }
    });
  });

  return li;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── Add todo ─────────────────────────────────────────────────────────────────
document.getElementById('add-form').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('add-input');
  const text  = input.value.trim();
  if (!text) return;
  input.value = '';
  db.ref('todos').push({ text, done: false, createdAt: Date.now() }).catch(() => {
    input.value = text;
    showError('Failed to add — try again.');
  });
});

// ─── Firebase: sync todos ─────────────────────────────────────────────────────
db.ref('todos').on('child_added', snap => {
  const li = createTodoEl(snap.key, snap.val());
  todoEls[snap.key] = li;
  list.appendChild(li);
  updateEmpty();
});

db.ref('todos').on('child_changed', snap => {
  const { text, done } = snap.val();
  const li = todoEls[snap.key];
  if (!li) return;
  li.className = 'todo-item' + (done ? ' done' : '');
  li.querySelector('input[type="checkbox"]').checked = done;
  li._textSpan.textContent = text; // works even when span is detached during editing
});

db.ref('todos').on('child_removed', snap => {
  const li = todoEls[snap.key];
  if (!li) return;
  li.remove();
  delete todoEls[snap.key];
  updateEmpty();
});

db.ref('todos').on('value', (snap) => {
  console.log('todos value', snap.val());
})

// ─── Firebase: presence ───────────────────────────────────────────────────────
const presenceRef = db.ref('presence/' + Math.random().toString(36).slice(2, 10));
presenceRef.set(true);
presenceRef.onDisconnect().remove();

db.ref('presence').on('value', snap => {
  const n = snap.numChildren();
  document.getElementById('users').textContent = n + (n === 1 ? ' person' : ' people') + ' online';
});

// ─── Firebase: connection status ──────────────────────────────────────────────
const statusEl = document.getElementById('status');
db.ref('.info/connected').on('value', snap => {
  statusEl.textContent = snap.val() ? 'Connected' : 'Disconnected';
  statusEl.className   = snap.val() ? 'connected'  : 'disconnected';
});
</script>
</body>
</html>
