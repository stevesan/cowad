<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOOM Map Editor</title>
</head>
<body>

<div id="toolbar">
  <h1>DOOM ED</h1>
  <button class="tool-btn active" data-tool="select" title="Select / Move (S)">S</button>
  <button class="tool-btn" data-tool="draw"   title="Draw Sector (D)">D</button>
  <button class="tool-btn" data-tool="thing"  title="Place Thing (T)">T</button>
  <select id="thing-type-sel">
    <optgroup label="Players">
      <option value="1">Player 1 Start</option>
      <option value="2">Player 2 Start</option>
      <option value="3">Player 3 Start</option>
      <option value="4">Player 4 Start</option>
      <option value="11">Deathmatch Start</option>
    </optgroup>
    <optgroup label="Doom Monsters">
      <option value="3004">Zombieman</option>
      <option value="9">Shotgun Guy</option>
      <option value="3001">Imp</option>
      <option value="3002">Demon</option>
      <option value="58">Spectre</option>
      <option value="3005">Cacodemon</option>
      <option value="3003">Baron of Hell</option>
      <option value="3006">Lost Soul</option>
      <option value="16">Cyberdemon</option>
      <option value="7">Spider Mastermind</option>
    </optgroup>
    <optgroup label="Doom 2 Monsters">
      <option value="65">Chaingun Guy</option>
      <option value="64">Arch-Vile</option>
      <option value="66">Revenant</option>
      <option value="67">Mancubus</option>
      <option value="68">Arachnotron</option>
      <option value="69">Hell Knight</option>
      <option value="71">Pain Elemental</option>
      <option value="84">Wolfenstein SS</option>
    </optgroup>
    <optgroup label="Weapons">
      <option value="2005">Chainsaw</option>
      <option value="2001">Shotgun</option>
      <option value="82">Super Shotgun</option>
      <option value="2002">Chaingun</option>
      <option value="2003">Rocket Launcher</option>
      <option value="2004">Plasma Rifle</option>
      <option value="2006">BFG 9000</option>
    </optgroup>
    <optgroup label="Ammo">
      <option value="2007">Clip</option>
      <option value="2048">Box of Bullets</option>
      <option value="2008">Shells</option>
      <option value="2049">Box of Shells</option>
      <option value="2010">Rocket</option>
      <option value="2046">Box of Rockets</option>
      <option value="2047">Energy Cell</option>
      <option value="17">Energy Cell Pack</option>
    </optgroup>
    <optgroup label="Health">
      <option value="2014">Health Bonus</option>
      <option value="2011">Stimpack</option>
      <option value="2012">Medikit</option>
      <option value="2013">Soulsphere</option>
      <option value="83">Megasphere</option>
    </optgroup>
    <optgroup label="Armor">
      <option value="2015">Armor Bonus</option>
      <option value="2018">Green Armor</option>
      <option value="2019">Blue Armor</option>
    </optgroup>
    <optgroup label="Keys">
      <option value="5">Blue Keycard</option>
      <option value="13">Red Keycard</option>
      <option value="6">Yellow Keycard</option>
      <option value="40">Blue Skull Key</option>
      <option value="38">Red Skull Key</option>
      <option value="39">Yellow Skull Key</option>
    </optgroup>
    <optgroup label="Power-ups">
      <option value="2022">Invulnerability</option>
      <option value="2023">Berserk</option>
      <option value="2024">Invisibility</option>
      <option value="2025">Radiation Suit</option>
      <option value="2026">Computer Map</option>
      <option value="2045">Light Goggles</option>
    </optgroup>
  </select>
  <div class="sep"></div>
  <label style="color:#888;font-size:11px;font-family:monospace;">Grid
    <select id="snap-size-sel" style="background:#222;color:#ccc;border:1px solid #444;font-size:11px;font-family:monospace;padding:2px;">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="4">4</option>
      <option value="8" selected>8</option>
      <option value="16">16</option>
      <option value="32">32</option>
      <option value="64">64</option>
    </select>
  </label>
  <div class="sep"></div>
  <button id="import-wad-btn" style="background:#1a1a2e;border:1px solid #446;color:#88f;padding:3px 10px;cursor:pointer;border-radius:3px;font-size:12px;font-family:monospace;">Import IWAD</button>
  <button id="clean-btn" style="background:#1a2a1a;border:1px solid #464;color:#8f8;padding:3px 10px;cursor:pointer;border-radius:3px;font-size:12px;font-family:monospace;">Clean</button>
  <button id="wad-btn" style="background:#1a1a2e;border:1px solid #446;color:#88f;padding:3px 10px;cursor:pointer;border-radius:3px;font-size:12px;font-family:monospace;">Export WAD</button>
  <button id="play-btn" style="background:#2a1a1a;border:1px solid #644;color:#f88;padding:3px 10px;cursor:pointer;border-radius:3px;font-size:12px;font-family:monospace;">Play</button>
  <button id="clear-btn">Clear</button>
  <span id="coords">0, 0</span>
  <span id="users"></span>
  <span id="status">Connecting…</span>
</div>

<div id="main">
  <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
  <div id="panel">
    <div id="panel-empty">Nothing selected.</div>
    <div id="panel-content" style="display:none"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
