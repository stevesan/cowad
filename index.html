<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOOM Map Editor</title>
</head>
<body>

<div id="toolbar">
  <h1>DOOM ED</h1>
  <button class="tool-btn active" data-tool="select" title="Select / Move (S)">S</button>
  <button class="tool-btn" data-tool="draw"   title="Draw Sector (D)">D</button>
  <button class="tool-btn" data-tool="thing"  title="Place Thing (T)">T</button>
  <button id="view3d-btn" class="tool-btn" title="Toggle 3D View (3)">3D</button>
  <button id="thing-type-btn" class="tool-btn" title="Choose thing type"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#0f0;vertical-align:middle;margin-right:4px;"></span>Player 1 Start</button>
  <div class="sep"></div>
  <label style="color:#888;font-size:11px;font-family:monospace;">Grid
    <select id="snap-size-sel" style="background:#222;color:#ccc;border:1px solid #444;font-size:11px;font-family:monospace;padding:2px;">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="4">4</option>
      <option value="8" selected>8</option>
      <option value="16">16</option>
      <option value="32">32</option>
      <option value="64">64</option>
    </select>
  </label>
  <div class="sep"></div>
  <button id="import-wad-btn" style="background:#1a1a2e;border:1px solid #446;color:#88f;padding:3px 10px;cursor:pointer;border-radius:3px;font-size:12px;font-family:monospace;">Import IWAD</button>
  <button id="clean-btn" style="background:#1a2a1a;border:1px solid #464;color:#8f8;padding:3px 10px;cursor:pointer;border-radius:3px;font-size:12px;font-family:monospace;">Clean</button>
  <button id="wad-btn" style="background:#1a1a2e;border:1px solid #446;color:#88f;padding:3px 10px;cursor:pointer;border-radius:3px;font-size:12px;font-family:monospace;">Export WAD</button>
  <button id="play-btn" style="background:#2a1a1a;border:1px solid #644;color:#f88;padding:3px 10px;cursor:pointer;border-radius:3px;font-size:12px;font-family:monospace;">Play</button>
  <button id="clear-btn">Clear</button>
  <span id="coords">0, 0</span>
  <span id="users"></span>
  <span id="status">Connecting…</span>
</div>

<div id="main">
  <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
  <div id="panel">
    <div id="panel-empty">Nothing selected.</div>
    <div id="panel-content" style="display:none"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
